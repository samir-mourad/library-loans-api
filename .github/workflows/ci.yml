name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Library.slnx

      - name: Build
        run: dotnet build Library.slnx -c Release --no-restore

      # Integration tests use Testcontainers; ubuntu runners ship with Docker.
      - name: Test
        run: dotnet test --solution Library.slnx -c Release --no-build

      - name: Docker build (api)
        run: docker build -f src/Library.Api/Dockerfile --target runtime -t library-api:ci .

      - name: Docker build (migrator)
        run: docker build -f src/Library.Api/Dockerfile --target migrator -t library-migrator:ci .
