apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-api
  labels:
    app.kubernetes.io/name: library-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: library-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: library-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: library-api-config
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: library-api-secrets
                  key: ConnectionStrings__Postgres
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: library-api-secrets
                  key: ConnectionStrings__Redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Liveness never checks dependencies: a PostgreSQL or Redis outage must not restart the process.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness fails only without PostgreSQL; Redis down reports Degraded (200) and keeps serving.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
