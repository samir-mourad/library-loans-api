# Applies EF Core migrations once per release, before the Deployment rolls out.
# Replicas never migrate on startup.
apiVersion: batch/v1
kind: Job
metadata:
  name: library-api-migrations
  labels:
    app.kubernetes.io/name: library-api
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: library-api
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: library-migrator:1.0.0
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: library-api-secrets
                  key: ConnectionStrings__Postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
